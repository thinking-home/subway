            <path class="th-diagram-arrow" d="M0 0 L10 5 L0 10 z"/>
        </marker>
    </defs>
    <path class="th-diagram-link" d="M178 85 H225"/>
    <path class="th-diagram-link" d="M442 85 H403" marker-end="url(#th-arrow-tunnel)"/>
    <rect class="th-diagram-box" x="8" y="49" width="170" height="72" rx="10"/>
    <g class="th-diagram-icon" transform="translate(24 73)">
